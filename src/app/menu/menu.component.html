<h2>Étlap</h2>

<table class="table">
  <thead>
    <tr>
      <th>Név</th>
      <th>Kategória</th>
      <th>Ár (Ft)</th>
      <th>Vegetáriánus</th>
    </tr>
  </thead>
  <tbody>
    @for(etel of etlap; track etel.nev) {
      <tr [class]="etel.vega ? 'table-success' : ''">
        <td>
          {{ etel.nev }}
          @if(etel.kategoria == 'Főétel' && etel.ar > 3000) {
            <span class="badge bg-danger">Nagy</span>
          }
        </td>
        <td>{{ etel.kategoria }}</td>
        <td>{{ etel.ar }}</td>
        <td>
          {{ etel.vega ? 'igen' : 'nem' }}
        </td>
      </tr>
    }
  </tbody>
</table>
